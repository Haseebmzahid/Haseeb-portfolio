k</text><text x="380" y="497" font-size="19" fill="#37495b" >the next available appointment.</text><rect x="358" y="567" width="535" height="113" rx="14" fill="#e3ece8"/><text x="380" y="607" font-size="18" fill="#45675b" >Availability checked</text><text x="380" y="640" font-size="18" fill="#45675b" >10:30   /   11:00   /   14:00</text><rect x="946" y="155" width="455" height="690" rx="18" fill="#17202e"/><text x="973" y="200" font-size="20" fill="#d9e2ee" >Appointment orchestration</text><rect x="969" y="235" width="407" height="68" rx="12" fill="#1c2939"/><text x="990" y="276" font-size="18" fill="#a9bad0" >01  Understand intent</text><rect x="969" y="327" width="407" height="68" rx="12" fill="#1c2939"/><text x="990" y="368" font-size="18" fill="#a9bad0" >02  Retrieve availability</text><rect x="969" y="419" width="407" height="68" rx="12" fill="#1c2939"/><text x="990" y="460" font-size="18" fill="#a9bad0" >03  Reserve the slot</text><rect x="969" y="511" width="407" height="68" rx="12" fill="#1c2939"/><text x="990" y="552" font-size="18" fill="#a9bad0" >04  Write appointment</text><rect x="969" y="603" width="407" height="68" rx="12" fill="#1c2939"/><text x="990" y="644" font-size="18" fill="#a9bad0" >05  Confirm with patient</text><text x="54" y="881" font-size="10" fill="#8798b1" letter-spacing="2">ILLUSTRATIVE WORKFLOW · NO PATIENT DATA OR CLINIC CONNECTION</text></g></svg>